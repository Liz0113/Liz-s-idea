<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✦ SAKURA TAROT ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --cream: #FFF5EE;
      --cream-dark: #F5E6D3;
      --pink-light: #FFE4EC;
      --pink: #FFB6C8;
      --pink-deep: #FF8FAB;
      --rose: #E891A0;
      --gold: #D4A853;
      --gold-light: #E8C97A;
      --gold-dark: #B8860B;
      --lavender: #E8D5F5;
      --sky: #B8D4E8;
      --text-brown: #8B6F5E;
      --text-light: #B0897A;
    }
    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-brown);
    }

    /* ===== 背景 ===== */
    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: 
        radial-gradient(ellipse at 15% 25%, rgba(255,182,200,0.35) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 20%, rgba(232,213,245,0.4) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 80%, rgba(184,212,232,0.3) 0%, transparent 50%),
        linear-gradient(180deg, #FFEFF5 0%, var(--cream) 40%, #FFF0EB 100%);
    }
    .float-deco {
      position: absolute; font-size: 18px; opacity: 0.25;
      animation: floatDeco 10s ease-in-out infinite;
    }
    @keyframes floatDeco {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(12deg); }
    }

    /* ===== 页面 ===== */
    .page {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .page.active { display: flex; }

    /* ==================== 首页 ==================== */
    #start-page { justify-content: center; overflow: hidden; }

    .wing-title-wrap {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 30px;
    }
    .wings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .wing-left, .wing-right { font-size: 36px; opacity: 0.7; }
    .main-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 52px;
      background: linear-gradient(135deg, var(--rose), var(--pink-deep), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 14px;
    }
    .sub-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px; letter-spacing: 10px; color: var(--text-light); margin-top: 4px;
    }
    .magic-area {
      position: relative; width: 300px; height: 340px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
    }
    .outer-glow {
      position: absolute; width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,182,200,0.2), transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.08);opacity:1} }
    .magic-ring {
      position: absolute; width: 280px; height: 280px; border-radius: 50%;
      border: 2px solid rgba(212,168,83,0.4);
      box-shadow: 0 0 25px rgba(212,168,83,0.15), inset 0 0 25px rgba(212,168,83,0.08);
      animation: spinRing 20s linear infinite;
    }
    .magic-ring::before {
      content: ''; position: absolute; inset: 12px; border-radius: 50%;
      border: 1.5px dashed rgba(212,168,83,0.3);
      animation: spinRing 15s linear infinite reverse;
    }
    .magic-ring::after {
      content: ''; position: absolute; inset: 32px; border-radius: 50%;
      border: 1px solid rgba(255,143,171,0.3);
      animation: spinRing 10s linear infinite;
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }
    .star-rays { position: absolute; width: 280px; height: 280px; pointer-events: none; }
    .star-ray {
      position: absolute; top: 50%; left: 50%; width: 2px; height: 60px;
      background: linear-gradient(to bottom, var(--gold-light), transparent);
      transform-origin: center top; margin-left: -1px; opacity: 0.5;
    }
    .center-card-display {
      position: relative; width: 120px; height: 190px; z-index: 5;
      animation: cardFloat 3s ease-in-out infinite;
    }
    @keyframes cardFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .display-card-back {
      position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255,220,230,0.8) 0%, transparent 55%),
        linear-gradient(170deg, #FFD4E5 0%, #FFB6C8 30%, #F5A0B8 70%, #E891A0 100%);
      border: 2.5px solid var(--gold);
      box-shadow: 0 8px 28px rgba(180,100,130,0.25), 0 2px 8px rgba(180,100,130,0.15), inset 0 0 20px rgba(255,255,255,0.3);
    }
    .display-card-back::before {
      content: ''; position: absolute; inset: 5px; border-radius: 7px;
      border: 1px dashed rgba(212,168,83,0.4);
    }
    .d-corner { position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); }
    .d-corner.tl { top:7px;left:7px;border-right:none;border-bottom:none }
    .d-corner.tr { top:7px;right:7px;border-left:none;border-bottom:none }
    .d-corner.bl { bottom:7px;left:7px;border-right:none;border-top:none }
    .d-corner.br { bottom:7px;right:7px;border-left:none;border-top:none }
    .d-compass { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;color:var(--gold);filter:drop-shadow(0 0 12px rgba(212,168,83,0.5));z-index:1 }
    .d-wing-l,.d-wing-r { position:absolute;top:22px;font-size:24px;opacity:0.7;z-index:1 }
    .d-wing-l { left:16px;transform:scaleX(-1) }
    .d-wing-r { right:16px }
    .d-banner { position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(212,168,83,0.3),transparent);padding:3px 18px;border-radius:8px;font-family:'Cinzel Decorative',serif;font-size:9px;letter-spacing:5px;color:var(--gold-dark);z-index:1 }
    .d-star-s { position:absolute;font-size:7px;color:var(--gold);opacity:0.6;z-index:1 }
    .inject-btn-wrap { position:relative;cursor:pointer;z-index:200 }
    .inject-wings { display:flex;align-items:center;justify-content:center;gap:8px }
    .inject-wing { font-size:26px;opacity:0.65;transition:all 0.3s }
    .inject-btn {
      padding: 16px 52px; font-size: 17px;
      font-family: 'Ma Shan Zheng', cursive; color: white;
      background: linear-gradient(135deg, var(--pink-deep), var(--rose));
      border: none; border-radius: 28px; cursor: pointer;
      letter-spacing: 6px;
      box-shadow: 0 6px 24px rgba(232,143,160,0.35), 0 2px 8px rgba(232,143,160,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
    }
    .inject-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.5s;
    }
    .inject-btn:hover::before { left: 100%; }
    .inject-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 36px rgba(232,143,160,0.45); }
    .inject-btn.injecting { animation: injectPulse 1.3s ease forwards; }
    @keyframes injectPulse {
      0%{transform:scale(1)} 30%{transform:scale(1.15);box-shadow:0 0 60px rgba(255,182,200,0.7)}
      60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:0}
    }
    .burst-particles { position:absolute;inset:0;pointer-events:none;z-index:100 }
    .burst-particle { position:absolute;width:8px;height:8px;border-radius:50%;opacity:0 }
    .burst-particle.active { animation: burstOut 1s ease forwards; }
    @keyframes burstOut {
      0%{transform:translate(-50%,-50%) scale(1);opacity:1}
      100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
    }
    .footer-info { position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-light);letter-spacing:3px;opacity:0.6;z-index:20 }

    /* ==================== 牌阵选择页 ==================== */
    #spread-page { overflow-y: auto; padding: 35px 20px 40px; }
    .spread-header { text-align:center;margin-bottom:28px;margin-top:15px }
    .spread-header-title { font-family:'Ma Shan Zheng',cursive;font-size:38px;background:linear-gradient(135deg,var(--rose),var(--pink-deep));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px }
    .spread-header-sub { font-size:11px;color:var(--text-light);letter-spacing:5px }
    .spread-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%;max-width:850px;padding-bottom:30px }
    .spread-card {
      background:rgba(255,255,255,0.75);border:1.5px solid rgba(212,168,83,0.25);border-radius:18px;
      padding:22px;cursor:pointer;transition:all 0.35s ease;position:relative;overflow:hidden;backdrop-filter:blur(5px);
    }
    .spread-card::before {
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--pink),var(--lavender),var(--gold-light));opacity:0;transition:opacity 0.3s;
    }
    .spread-card:hover::before { opacity:1 }
    .spread-card:hover { transform:translateY(-5px);border-color:rgba(212,168,83,0.45);box-shadow:0 15px 40px rgba(180,100,130,0.15) }
    .spread-icon { font-size:32px;margin-bottom:10px }
    .spread-name { font-family:'Ma Shan Zheng',cursive;font-size:22px;color:var(--rose);margin-bottom:6px }
    .spread-desc { font-size:13px;color:var(--text-light);line-height:1.6;margin-bottom:10px }
    .spread-meta { display:flex;gap:12px;font-size:11px;color:var(--pink-deep) }

    /* ==================== 抽牌页（牌阵布局） ==================== */
    #draw-page { overflow: hidden; position: relative; }

    /* 顶部信息条 */
    .draw-topbar {
      width: 100%; text-align: center;
      padding: 16px 20px 10px;
      flex-shrink: 0;
      z-index: 20;
    }
    .spread-title-bar {
      font-family: 'Ma Shan Zheng', cursive; font-size: 26px;
      color: var(--rose); margin-bottom: 6px;
    }
    .progress-row {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.75); padding: 7px 18px; border-radius: 22px;
      border: 1px solid rgba(212,168,83,0.2); backdrop-filter: blur(5px);
    }
    .progress-dots { display: flex; gap: 6px; }
    .progress-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(212,168,83,0.2); transition: all 0.3s;
    }
    .progress-dot.active { background: var(--gold); box-shadow: 0 0 8px rgba(212,168,83,0.5); }
    .progress-dot.filled { background: var(--pink-deep); }

    /* 交互模式切换 */
    .mode-toggle {
      position: absolute; top: 15px; right: 15px; z-index: 500;
      display: flex; gap: 6px;
    }
    .mode-btn {
      padding: 7px 14px; border-radius: 16px; border: 1.5px solid rgba(212,168,83,0.3);
      background: rgba(255,255,255,0.85); color: var(--text-brown);
      font-size: 12px; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(5px);
    }
    .mode-btn.active {
      background: linear-gradient(135deg, var(--pink-deep), var(--rose));
      color: white; border-color: transparent;
      box-shadow: 0 4px 14px rgba(232,143,160,0.35);
    }

    /* 牌阵容器 */
    .spread-layout-area {
      flex: 1; width: 100%; position: relative;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .spread-layout-canvas {
      position: relative;
      /* 动态宽高由JS设置 */
    }

    /* 牌位槽 */
    .slot-card {
      position: absolute;
      width: 72px; height: 114px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      transform: translate(-50%, -50%);
    }
    /* 未抽状态：牌背 */
    .slot-card .s-back {
      position: absolute; inset: 0; border-radius: 8px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255,225,235,0.9) 0%, transparent 55%),
        linear-gradient(165deg, #FFD4E5 0%, #FFB6C8 25%, #F5A0B8 60%, #E891A0 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 4px 14px rgba(140,80,100,0.2), inset 0 0 12px rgba(255,255,255,0.2);
      overflow: hidden;
    }
    .slot-card .s-back::before {
      content: ''; position: absolute; inset: 4px; border-radius: 5px;
      border: 1px dashed rgba(212,168,83,0.35);
    }
    .slot-card .s-back::after {
      content: ''; position: absolute; inset: 8px; border-radius: 4px;
      border: 1px solid rgba(212,168,83,0.2);
    }
    .s-corner { position:absolute;width:9px;height:9px;border:1.5px solid var(--gold) }
    .s-corner.tl{top:4px;left:4px;border-right:none;border-bottom:none}
    .s-corner.tr{top:4px;right:4px;border-left:none;border-bottom:none}
    .s-corner.bl{bottom:4px;left:4px;border-right:none;border-top:none}
    .s-corner.br{bottom:4px;right:4px;border-left:none;border-top:none}
    .s-star { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(212,168,83,0.35));z-index:1 }
    .s-banner { position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;font-size:5.5px;letter-spacing:2px;color:var(--gold-dark);opacity:0.7;z-index:1 }
    /* 牌位标签 */
    .slot-label {
      position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--text-light); white-space: nowrap;
      font-family: 'Ma Shan Zheng', cursive; font-size: 13px;
    }
    /* 当前需要抽的牌位 */
    .slot-card.current {
      filter: drop-shadow(0 0 12px rgba(212,168,83,0.6));
      animation: slotPulse 1.8s ease-in-out infinite;
    }
    @keyframes slotPulse {
      0%,100%{transform:translate(-50%,-50%) scale(1)}
      50%{transform:translate(-50%,-50%) scale(1.06)}
    }
    /* 悬浮高亮（手势/鼠标） */
    .slot-card.hovered {
      filter: drop-shadow(0 0 18px rgba(255,143,171,0.7));
      transform: translate(-50%,-50%) scale(1.1) translateY(-8px) !important;
      z-index: 50 !important;
    }
    /* 已抽：显示牌面 */
    .slot-card .s-front {
      position: absolute; inset: 0; border-radius: 8px;
      border: 2px solid var(--gold);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      overflow: hidden;
    }
    .slot-card.drawn-slot .s-back { opacity: 0; }
    .slot-card.drawn-slot .s-front { opacity: 1; pointer-events: auto; }
    .slot-card.drawn-slot { animation: none !important; }
    /* 翻牌动画 */
    .slot-card.flipping {
      animation: flipCard 0.5s ease !important;
    }
    @keyframes flipCard {
      0%{transform:translate(-50%,-50%) scale(1.15) rotateY(0deg)}
      50%{transform:translate(-50%,-50%) scale(1.2) rotateY(90deg)}
      100%{transform:translate(-50%,-50%) rotateY(0deg)}
    }
    /* 牌面样式（渐变色） */
    .sf-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #FFF0F5, #FFE4EC, #FFF5F0);
    }
    .sf-sym { position:relative;font-size:22px;margin-bottom:4px;color:var(--rose);z-index:1 }
    .sf-name { position:relative;font-size:10px;color:var(--rose);font-family:'Ma Shan Zheng',cursive;z-index:1;text-align:center;padding:0 4px }
    .sf-ori { position:relative;font-size:9px;z-index:1;padding:2px 6px;border-radius:6px;margin-top:2px }
    .sf-ori.up{background:rgba(212,168,83,0.15);color:var(--gold-dark)}
    .sf-ori.rev{background:rgba(232,213,245,0.5);color:#9370DB}

    /* 牌阵连线装饰 */
    .spread-lines {
      position: absolute; inset: 0; pointer-events: none;
    }

    /* 摄像头 */
    .camera-box {
      position: fixed; top: 15px; right: 15px;
      width: 130px; height: 98px; border-radius: 12px; overflow: hidden;
      border: 2px solid rgba(212,168,83,0.3); z-index: 350; display: none;
      background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .camera-box.active { display: block; }
    .camera-box video { width:100%;height:100%;object-fit:cover;transform:scaleX(-1) }

    /* 手势光标 */
    .hand-cursor {
      position: fixed; width: 60px; height: 60px;
      border: 2.5px solid var(--pink-deep); border-radius: 50%;
      pointer-events: none; z-index: 200; display: none;
      box-shadow: 
        0 0 20px rgba(255,143,171,0.5),
        0 0 40px rgba(255,182,200,0.3),
        inset 0 0 20px rgba(255,228,236,0.3);
      transition: transform 0.05s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .hand-cursor.active { display: block; }
    .hand-cursor::after {
      content: ''; position: absolute; inset: 10px;
      border: 1.5px solid var(--gold); border-radius: 50%;
      animation: cursorPulse 1.2s ease-in-out infinite;
    }
    .hand-cursor::before {
      content: ''; position: absolute; inset: -8px;
      border: 1px solid rgba(255,143,171,0.3); border-radius: 50%;
      animation: cursorRing 2s ease-out infinite;
    }
    @keyframes cursorPulse { 0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(0.75); opacity:0.7} }
    @keyframes cursorRing { 0%{transform:scale(0.8); opacity:0.8} 100%{transform:scale(1.5); opacity:0} }
    .hand-cursor.pinching {
      border-color: var(--gold); 
      background: rgba(212,168,83,0.2); 
      transform: scale(0.7);
      box-shadow: 
        0 0 30px rgba(212,168,83,0.6),
        0 0 60px rgba(212,168,83,0.4),
        inset 0 0 25px rgba(212,168,83,0.3);
    }

    /* 手势特效 Canvas */
    #gesture-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 200;
      display: none;
    }
    body.gesture-mode #gesture-canvas { display: block; }

    /* 扇形牌叠层 */
    #fan-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 180;
      display: none;
    }
    #fan-overlay.active { 
      display: block; 
    }

    /* 扇形单张牌 */
    .fan-card {
      position: absolute;
      width: 68px; height: 108px;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: center center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, left, top;
      filter: drop-shadow(0 6px 16px rgba(140,80,100,0.25));
    }
    .fan-card:hover,
    .fan-card.fan-hovered {
      transform: scale(1.2) translateY(-35px) !important;
      z-index: 100 !important;
      filter: drop-shadow(0 0 25px rgba(255,143,171,0.7)) drop-shadow(0 8px 25px rgba(140,80,100,0.3));
    }
    .fan-card.fan-hovered .s-back {
      border-color: var(--gold-light);
      box-shadow: 
        0 0 35px rgba(255,143,171,0.8),
        0 8px 30px rgba(140,80,100,0.3),
        inset 0 0 20px rgba(255,255,255,0.4);
    }
    .fan-card .s-back {
      position: absolute; inset: 0; border-radius: 8px;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255,235,245,0.95) 0%, transparent 55%),
        linear-gradient(165deg, #FFE4EC 0%, #FFB6C8 25%, #F5A0B8 65%, #E891A0 100%);
      border: 2px solid var(--gold);
      box-shadow: 
        0 6px 20px rgba(140,80,100,0.2), 
        inset 0 0 12px rgba(255,255,255,0.35);
      overflow: hidden;
    }
    .fan-card .s-back::before {
      content: ''; position: absolute; inset: 4px; border-radius: 5px;
      border: 1px dashed rgba(212,168,83,0.4);
    }
    .fan-card.selected-card {
      transform: scale(1.2) translateY(-40px) !important;
      z-index: 100 !important;
      animation: selectedGlow 1s ease-in-out infinite;
    }
    .fan-card.selected-card .s-back {
      box-shadow: 
        0 0 50px rgba(212,168,83,0.8), 
        0 0 100px rgba(255,182,200,0.5),
        inset 0 0 20px rgba(255,255,255,0.5);
      border-color: var(--gold-light);
    }
    @keyframes selectedGlow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(212,168,83,0.6)); }
      50% { filter: drop-shadow(0 0 50px rgba(212,168,83,0.9)); }
    }
    /* 悬停光晕 */
    .fan-glow {
      position: absolute; inset: -15px;
      border-radius: 15px;
      background: radial-gradient(ellipse at center, rgba(255,143,171,0.5) 0%, transparent 70%);
      opacity: 0;

    let spread = null, drawn = [];

    // ===== 初始化背景 =====

    // ===== 注入魔法 =====
    function doInject() {

      btn.disabled = true; btn.classList.add('injecting');

    // ===== 渲染牌阵选择 =====
    function renderSpreads() {
      document.getElementById('spread-grid').innerHTML = SPREADS.map(s => `
        <div class="spread-card" onclick="pickSpread('${s.id}')">
          <div class="spread-icon">${s.icon}</div>
          <div class="spread-name">${s.name}</div>
          <div class="spread-desc">${s.desc}</div>
          <div class="spread-meta"><span>✦ ${s.count}张牌</span><span>${s.pos.slice(0,3).join('·')}</span></div>

    // ===== 选择牌阵 =====
    function pickSpread(id) {
      spread = SPREADS.find(s => s.id === id);
      drawn = [];
      document.getElementById('spread-page').classList.remove('active');
      document.getElementById('draw-page').classList.add('active');
      document.getElementById('spread-title-label').textContent = spread.name;
      document.getElementById('progress-dots').innerHTML =

          `<div class="progress-dot ${i===0?'active':''}"></div>`).join('');

      renderSpreadLayout();
      initFanOverlay();

      document.querySelectorAll('.slot-card').forEach(slot => {
        slot.style.pointerEvents = 'none';
      });
      // 更新提示文字
      document.getElementById('draw-hint').textContent = '🌸 点击下方展开的牌组自由选牌';

    // ===== 更新进度 =====
    function updateProg() {
      const total = spread.count, done = drawn.length;
      document.getElementById('prog-txt').textContent = `${done}/${total}`;
      document.querySelectorAll('.progress-dot').forEach((d,i) => {
        d.classList.remove('active','filled');
        if(i<done) d.classList.add('filled');
        else if(i===done) d.classList.add('active');
      });
    }

    // ===== 渲染牌阵布局 =====
    function renderSpreadLayout() {
      const canvas = document.getElementById('spread-layout-canvas');
      const area = document.getElementById('spread-layout-area');
      const svg = document.getElementById('spread-lines');
      canvas.innerHTML = '';
      canvas.appendChild(svg);
      svg.innerHTML = '';

      const layout = spread.layout;
      if(!layout || layout.length === 0) return;

      // 计算边界
      const cardW = 72, cardH = 114, padding = 60;
      const xs = layout.map(p=>p.x), ys = layout.map(p=>p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const totalW = (maxX-minX) + cardW + padding*2;
      const totalH = (maxY-minY) + cardH + padding*2;
      const offX = -minX + padding + cardW/2;
      const offY = -minY + padding + cardH/2;

      // 缩放适应屏幕
      const areaW = area.clientWidth || window.innerWidth;
      const areaH = area.clientHeight || (window.innerHeight - 160);
      const scale = Math.min(1, areaW / totalW, areaH / totalH);

      canvas.style.width = (totalW * scale) + 'px';
      canvas.style.height = (totalH * scale) + 'px';
      canvas.style.transform = `scale(1)`;
      svg.setAttribute('width', totalW * scale);
      svg.setAttribute('height', totalH * scale);
      svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

      // 画连线
      if(spread.lines) {
        spread.lines.forEach(([a,b]) => {
          if(a >= layout.length || b >= layout.length) return;
          const pa = layout[a], pb = layout[b];
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1', (pa.x + offX) * scale);
          line.setAttribute('y1', (pa.y + offY) * scale);
          line.setAttribute('x2', (pb.x + offX) * scale);
          line.setAttribute('y2', (pb.y + offY) * scale);
          line.setAttribute('stroke', 'rgba(212,168,83,0.25)');
          line.setAttribute('stroke-width', '1.5');
          line.setAttribute('stroke-dasharray', '5,4');
          svg.appendChild(line);
        });
      }

      // 生成牌位
      layout.forEach((pt, i) => {
        // 凯尔特十字第0和1叠加（偏移一点）
        const realX = (pt.x + offX) * scale + (i===1 ? 6 : 0);
        const realY = (pt.y + offY) * scale + (i===1 ? -6 : 0);

        const slot = document.createElement('div');
        slot.className = 'slot-card' + (i === 0 ? ' current' : '');
        slot.dataset.idx = i;
        slot.style.left = realX + 'px';
        slot.style.top = realY + 'px';
        slot.style.width = (cardW * scale) + 'px';
        slot.style.height = (cardH * scale) + 'px';

        // 牌背内容
        const back = document.createElement('div');
        back.className = 's-back';
        ['tl','tr','bl','br'].forEach(cls => {
          const c = document.createElement('div');
          c.className = `s-corner ${cls}`;
          back.appendChild(c);
        });
        const star = document.createElement('div'); star.className = 's-star'; star.textContent = '✧';
        const banner = document.createElement('div'); banner.className = 's-banner'; banner.textContent = 'TAROT';
        back.appendChild(star); back.appendChild(banner);

        // 牌面（空，抽牌后填充）
        const front = document.createElement('div'); front.className = 's-front';
        const bg = document.createElement('div'); bg.className = 'sf-bg';
        const sym = document.createElement('div'); sym.className = 'sf-sym';
        const name = document.createElement('div'); name.className = 'sf-name';
        const ori = document.createElement('div'); ori.className = 'sf-ori';
        front.appendChild(bg); front.appendChild(sym); front.appendChild(name); front.appendChild(ori);

        // 标签
        const label = document.createElement('div');
        label.className = 'slot-label';
        label.textContent = spread.pos[i] || '';
        label.style.transform = `translateX(-50%) scale(${1/scale})`;
        label.style.fontSize = Math.max(10, 13*scale) + 'px';

        slot.appendChild(back); slot.appendChild(front); slot.appendChild(label);

        slot.addEventListener('click', () => {
          if(currentMode === 'click') drawCard(slot, i);
        });
        canvas.appendChild(slot);
      });
    }

    // ===== 抽牌逻辑 =====
    function drawCard(slotEl, idx) {
      if(slotEl.classList.contains('drawn-slot')) return;
      if(drawn.length >= spread.count) return;
      // 必须按顺序抽
      if(idx !== drawn.length) return;

      const cid = Math.floor(Math.random() * 22);
      const rev = Math.random() > 0.5;
      const c = CARDS[cid];
      const d = {
        id: cid, name: c.name, sym: c.sym, reversed: rev,
        meaning: rev ? c.rev : c.up, pos: spread.pos[idx]
      };
      drawn.push(d);

      // 填充牌面
      const front = slotEl.querySelector('.s-front');
      front.querySelector('.sf-sym').textContent = c.sym;
      front.querySelector('.sf-name').textContent = c.name + (rev ? '\n逆位' : '');
      const oriEl = front.querySelector('.sf-ori');
      oriEl.textContent = rev ? '↩逆位' : '↗正位';
      oriEl.className = 'sf-ori ' + (rev ? 'rev' : 'up');

      // 翻牌动画
      slotEl.classList.remove('current','hovered');
      slotEl.classList.add('flipping');
      setTimeout(() => {
        slotEl.classList.remove('flipping');
        slotEl.classList.add('drawn-slot');
        // 激活下一个牌位
        const nextSlot = document.querySelector(`.slot-card[data-idx="${drawn.length}"]`);
        if(nextSlot && !nextSlot.classList.contains('drawn-slot')) {
          nextSlot.classList.add('current');
        }
        updateProg();
        if(drawn.length === spread.count) {
          setTimeout(showResult, 900);
        }
      }, 500);
    }

    // ===== 交互模式 =====
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-click').classList.toggle('active', mode === 'click');
      document.getElementById('btn-gesture').classList.toggle('active', mode === 'gesture');
      const hint = document.getElementById('draw-hint');
      
      // 隐藏摄像头和手势相关UI
      document.getElementById('camera-box').classList.remove('active');
      document.getElementById('gesture-tip').classList.remove('active');
      document.getElementById('hand-cursor').classList.remove('active');
      
      if(mode === 'click') {
        hint.textContent = '🌸 点击下方展开的牌组自由选牌';
        document.body.classList.remove('gesture-mode');
        // 点击模式：显示牌组，隐藏摄像头
        document.getElementById('fan-overlay').classList.add('active');
        if(cam) { try{ cam.stop(); }catch(e){} cam = null; handsObj = null; }
      } else {
        hint.textContent = '🖐 挥手滑动牌组 · 悬停选牌 · 捏合抽牌';
        document.body.classList.add('gesture-mode');
        // 手势模式：显示牌组和摄像头
        document.getElementById('fan-overlay').classList.add('active');
        document.getElementById('gesture-tip').classList.add('active');
        if(!cam) startCam();
      }
      
      // 禁用牌阵槽位点击
      document.querySelectorAll('.slot-card').forEach(slot => {
        slot.style.pointerEvents = 'none';
      });
      
      updateCardLayout();
    }

    // ===============================================================
    // ===== 粒子交互手势系统 =====
    // ===============================================================

    // 粒子交互状态
    const PS = {
      particles: [],           // 粒子数组
      handTrail: [],          // 手部轨迹点
      lastHandX: null,
      lastHandY: null,
      handVelocity: { x: 0, y: 0 },
      cursorScale: 1,         // 光标缩放（根据手掌张开程度）
      isHovering: false,
      hoveredCardIdx: -1,
      pinchStartTime: 0,
      cooldown: false
    };

    // 粒子参数
    const PARTICLE_CONFIG = {
      maxParticles: 200,
      trailInterval: 16,
      burstCount: 40,
      starCount: 15
    };

    // 摄像头+MediaPipe画布
    let gestureCanvas = null, gestureCtx = null;

    async function startCam() {
      const video = document.getElementById('input-video');

      // 创建手势特效 canvas（覆盖全屏）
      if(!gestureCanvas) {
        gestureCanvas = document.getElementById('gesture-canvas');
        gestureCtx = gestureCanvas.getContext('2d');
        gestureCanvas.width = window.innerWidth;
        gestureCanvas.height = window.innerHeight;
      }

      try {
        handsObj = new Hands({
          locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
        handsObj.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.55
        });
        handsObj.onResults(onHandResults);

        cam = new Camera(video, {
          onFrame: async () => {
            if(handsObj) await handsObj.send({ image: video });
          },
          width: 640, height: 480
        });
        await cam.start();
        document.getElementById('camera-box').classList.add('active');
        document.getElementById('fan-overlay').classList.add('active');

        // 启动渲染循环
        requestAnimationFrame(gestureRenderLoop);
      } catch(e) {
        console.warn('Camera init failed:', e.message);
        document.getElementById('gesture-tip').textContent = '⚠️ 摄像头不可用，请使用点击模式';
        document.getElementById('gesture-tip').classList.add('active');
      }
    }

    // ===== MediaPipe 结果回调 =====
    function onHandResults(res) {
      if(currentMode !== 'gesture') return;
      if(drawn.length >= spread.count) return;

      if(!res.multiHandLandmarks?.length) {
        PS.handTrail = [];
        PS.lastHandX = null;
        PS.lastHandY = null;
        return;
      }

      const lm = res.multiHandLandmarks[0];

      // 镜像X轴
      const toScreen = (l) => ({
        x: (1 - l.x) * window.innerWidth,
        y: l.y * window.innerHeight
      });

      const index = toScreen(lm[8]);   // 食指尖
      const thumb = toScreen(lm[4]);   // 拇指尖
      const palm = toScreen(lm[0]);    // 手腕
      const mid = toScreen(lm[12]);   // 中指尖

      const handX = index.x, handY = index.y;
      const thumbX = thumb.x, thumbY = thumb.y;

      // 计算手掌张开程度（影响光标大小）
      const fingerDist = Math.hypot(mid.x - palm.x, mid.y - palm.y);
      const thumbIndexDist = Math.hypot(index.x - thumb.x, index.y - thumb.y);
      PS.cursorScale = Math.min(1.5, Math.max(0.5, thumbIndexDist / 80));

      // 计算手部速度
      if(PS.lastHandX !== null) {
        PS.handVelocity.x = handX - PS.lastHandX;
        PS.handVelocity.y = handY - PS.lastHandY;
      }
      PS.lastHandX = handX;
      PS.lastHandY = handY;

      // 添加手部轨迹点
      PS.handTrail.push({
        x: handX,
        y: handY,
        age: 0,
        size: 8 + PS.cursorScale * 4
      });
      if(PS.handTrail.length > 50) {
        PS.handTrail.shift();
      }

      // 捏合检测
      const pinchDist = thumbIndexDist;
      const isPinching = pinchDist < 65;

      // 悬停检测 - 检测哪张牌被悬停
      if(!isPinching) {
        detectCardHover(handX, handY);
      }

      // 捏合触发抽牌
      if(isPinching && !PS.cooldown && PS.hoveredCardIdx >= 0) {
        triggerParticleDraw(PS.hoveredCardIdx, handX, handY);
        PS.cooldown = true;
        PS.hoveredCardIdx = -1;
        setTimeout(() => { PS.cooldown = false; }, 600);
      }
    }

    // ===== 检测手部悬停在哪张牌上 =====
    function detectCardHover(hx, hy) {
      const cards = document.querySelectorAll('#fan-overlay .fan-card');
      let found = -1;
      let minDist = Infinity;
      
      cards.forEach((card) => {
        card.classList.remove('fan-hovered');
        if(card.style.display === 'none') return;
        
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dist = Math.hypot(hx - cx, hy - cy);
        
        // 如果在100像素范围内，且比当前找到的更近
        if(dist < 100 && dist < minDist) {
          minDist = dist;
          found = parseInt(card.dataset.cardIdx);
        }
      });
      
      // 移除之前的高亮
      document.querySelectorAll('.fan-card.fan-hovered').forEach(c => c.classList.remove('fan-hovered'));
      
      // 高亮找到的卡牌
      if(found >= 0) {
        const hoverCard = document.querySelector(`#fan-overlay .fan-card[data-card-idx="${found}"]`);
        if(hoverCard) {
          hoverCard.classList.add('fan-hovered');
        }
      }
      
      PS.hoveredCardIdx = found;
    }

    // ===== 粒子交互抽牌 =====
    function triggerParticleDraw(cardIdx, fromX, fromY) {
      const targetSlotIdx = drawn.length;
      if(targetSlotIdx >= spread.count) return;

      const targetSlot = document.querySelector(`.slot-card[data-idx="${targetSlotIdx}"]`);
      if(!targetSlot) return;

      // 获取目标位置
      const slotRect = targetSlot.getBoundingClientRect();
      const toX = slotRect.left + slotRect.width / 2;
      const toY = slotRect.top + slotRect.height / 2;

      // 爆发大量粒子
      burstParticles(fromX, fromY);
      
      // 创建飞行卡牌
      const flyEl = document.createElement('div');
      flyEl.className = 'flying-tarot-card';
      flyEl.innerHTML = `
        <div class="s-back">
          <div class="s-corner tl"></div><div class="s-corner tr"></div>
          <div class="s-corner bl"></div><div class="s-corner br"></div>
          <div class="s-star">✧</div>
          <div class="s-banner">TAROT</div>
        </div>`;
      flyEl.style.left = (fromX - 40) + 'px';
      flyEl.style.top = (fromY - 63) + 'px';
      document.body.appendChild(flyEl);

      // 飞行轨迹动画
      const startX = fromX - 40, startY = fromY - 63;
      const endX = toX - 40, endY = toY - 63;
      const duration = 600;
      const startTime = performance.now();

      function animFly(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
        
        const curX = startX + (endX - startX) * ease;
        const curY = startY + (endY - startY) * ease;
        const scale = 1 + Math.sin(t * Math.PI) * 0.3;
        const rotate = ease * 360;
        
        flyEl.style.left = curX + 'px';
        flyEl.style.top = curY + 'px';
        flyEl.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        flyEl.style.opacity = t > 0.85 ? (1 - (t - 0.85) / 0.15) : 1;

        if(t < 1) {
          requestAnimationFrame(animFly);
        } else {
          flyEl.remove();
          performParticleDraw(cardIdx);
        }
      }
      requestAnimationFrame(animFly);
    }

    // ===== 执行粒子抽牌逻辑 =====
    function performParticleDraw(cardIdx) {
      const targetSlotIdx = drawn.length;
      if(targetSlotIdx >= spread.count) return;
      
      const targetSlot = document.querySelector(`.slot-card[data-idx="${targetSlotIdx}"]`);
      if(!targetSlot) return;
      
      const rev = Math.random() > 0.5;
      const c = CARDS[cardIdx];
      const d = {
        id: cardIdx, name: c.name, sym: c.sym, reversed: rev,
        meaning: rev ? c.rev : c.up, pos: spread.pos[targetSlotIdx]
      };
      drawn.push(d);
      
      const front = targetSlot.querySelector('.s-front');
      front.querySelector('.sf-sym').textContent = c.sym;
      front.querySelector('.sf-name').textContent = c.name + (rev ? '\n逆位' : '');
      const oriEl = front.querySelector('.sf-ori');
      oriEl.textContent = rev ? '↩逆位' : '↗正位';
      oriEl.className = 'sf-ori ' + (rev ? 'rev' : 'up');
      
      targetSlot.classList.add('flipping');
      setTimeout(() => {
        targetSlot.classList.remove('flipping');
        targetSlot.classList.add('drawn-slot');
        
        const nextSlot = document.querySelector(`.slot-card[data-idx="${drawn.length}"]`);
        if(nextSlot && !nextSlot.classList.contains('drawn-slot')) {
          nextSlot.classList.add('current');
        }
        updateProg();
        updateCardLayout();
        
        const slotRect = targetSlot.getBoundingClientRect();
        spawnDrawParticles(slotRect.left + slotRect.width/2, slotRect.top + slotRect.height/2);
        
        if(drawn.length === spread.count) {
          setTimeout(showResult, 900);
        }
      }, 500);
    }

    // ===== 粒子爆发效果 =====
    function burstParticles(x, y) {
      // 爆发粒子
      for(let i=0; i<PARTICLE_CONFIG.burstCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 10;
        PS.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.02,
          size: 5 + Math.random() * 8,
          color: Math.random() > 0.5 ? '#D4A853' : '#FF8FAB',
          type: 'burst'
        });
      }
      
      // 星星粒子
      for(let i=0; i<PARTICLE_CONFIG.starCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 6;
        PS.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          life: 1.0,
          decay: 0.015 + Math.random() * 0.015,
          size: 10 + Math.random() * 8,
          color: '#FFE4EC',
          type: 'star'
        });
      }
    }

    

    const particlePool = [];
    PS.particles = particlePool;

    // ===== 抽牌时爆发粒子 =====
    function spawnDrawParticles(x, y) {
      if(!gestureCtx) return;
      
      for(let i=0; i<30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 8;
        const size = 4 + Math.random() * 6;
        particlePool.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.025 + Math.random() * 0.02,
          size: size,
          color: Math.random() > 0.5 ? '#D4A853' : '#FF8FAB',
          type: 'burst'
        });
      }
      
      for(let i=0; i<12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 5;
        particlePool.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.015,
          size: 8 + Math.random() * 5,
          color: '#FFE4EC',
          type: 'star'
        });
      }
    }

    // ===== 渲染循环（粒子特效） =====
    function gestureRenderLoop() {
      // 检查是否在结果页，如果是则清空并停止绘制
      const resultPage = document.getElementById('result-page');
      if(resultPage && resultPage.classList.contains('active')) {
        if(gestureCtx && gestureCanvas) {
          gestureCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);
        }
        requestAnimationFrame(gestureRenderLoop);
        return;
      }
      
      if(currentMode !== 'gesture') {
        requestAnimationFrame(gestureRenderLoop);
        return;
      }
      if(!gestureCanvas || !gestureCtx) {
        requestAnimationFrame(gestureRenderLoop);
        return;
      }

      // 更新canvas尺寸
      if(gestureCanvas.width !== window.innerWidth || gestureCanvas.height !== window.innerHeight) {
        gestureCanvas.width = window.innerWidth;
        gestureCanvas.height = window.innerHeight;
      }

      const ctx = gestureCtx;
      ctx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);

      // ---- 绘制粒子轨迹 ----
      drawParticleTrail(ctx);

      // ---- 绘制粒子 ----
      drawParticles(ctx);

      // ---- 绘制手势光标 ----
      drawParticleCursor(ctx);

      requestAnimationFrame(gestureRenderLoop);
    }

    // ===== 绘制粒子轨迹 =====
    function drawParticleTrail(ctx) {
      if(PS.handTrail.length < 2) return;

      ctx.save();
      
      for(let i = 1; i < PS.handTrail.length; i++) {
        const p = PS.handTrail[i];
        const prev = PS.handTrail[i - 1];
        
        // 年龄增长
        p.age += 0.03;
        
        // 根据年龄计算透明度
        const alpha = Math.max(0, 1 - p.age);
        if(alpha <= 0) continue;

        const gradient = ctx.createLinearGradient(prev.x, prev.y, p.x, p.y);
        gradient.addColorStop(0, `rgba(255, 143, 171, ${alpha * 0.3})`);
        gradient.addColorStop(1, `rgba(212, 168, 83, ${alpha * 0.6})`);

        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = p.size * alpha;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#FF8FAB';
        ctx.shadowBlur = 15 * alpha;
        ctx.stroke();
      }

      ctx.restore();
    }

    // ===== 绘制粒子 =====
    function drawParticles(ctx) {
      for(let i = PS.particles.length - 1; i >= 0; i--) {
        const p = PS.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // 重力
        p.vx *= 0.98; // 阻力
        p.life -= p.decay;

        if(p.life <= 0) {
          PS.particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;

        if(p.type === 'star') {
          // 绘制星星
          ctx.shadowBlur = 20;
          ctx.font = `${p.size * p.life}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('✦', p.x, p.y);
        } else {
          // 绘制发光球
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
          
          // 外层光晕
          ctx.fillStyle = p.color + '30';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life * 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // ===== 绘制粒子光标 =====
    function drawParticleCursor(ctx) {
      if(PS.lastHandX === null) return;

      const x = PS.lastHandX;
      const y = PS.lastHandY;
      const scale = PS.cursorScale;
      const time = performance.now() / 1000;
      const r = 35 * scale;

      ctx.save();
      ctx.globalAlpha = 0.9;

      // 外层扩散环
      for(let i = 0; i < 3; i++) {
        const rippleR = r + 15 + i * 10 + Math.sin(time * 3 + i) * 5;
        const alpha = 0.2 - i * 0.05;
        ctx.beginPath();
        ctx.arc(x, y, rippleR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 143, 171, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = '#FF8FAB';
        ctx.shadowBlur = 15;
        ctx.stroke();
      }

      // 主光圈
      ctx.beginPath();
      ctx.arc(x, y, r + Math.sin(time * 4) * 3, 0, Math.PI * 2);
      ctx.strokeStyle = '#FF8FAB';
      ctx.shadowColor = '#FF8FAB';
      ctx.shadowBlur = 25;
      ctx.lineWidth = 3;
      ctx.stroke();

      // 内环
      ctx.beginPath();
      ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(212, 168, 83, 0.7)';
      ctx.shadowColor = '#D4A853';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 2;
      ctx.stroke();

      // 中心光点
      const centerSize = 8 + Math.sin(time * 6) * 3;
      ctx.fillStyle = '#FFE4EC';
      ctx.shadowColor = '#FF8FAB';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(x, y, centerSize, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ===== 初始化扇形牌叠层 =====
    function initFanOverlay() {
      const overlay = document.getElementById('fan-overlay');
      overlay.innerHTML = '';

      for(let i=0; i<22; i++) {
        const card = document.createElement('div');
        card.className = 'fan-card';
        card.dataset.cardIdx = i;
        card.dataset.fanIdx = i;
        card.innerHTML = `
          <div class="s-back">
            <div class="s-corner tl"></div><div class="s-corner tr"></div>
            <div class="s-corner bl"></div><div class="s-corner br"></div>
            <div class="s-star">✧</div>
            <div class="s-banner">TAROT</div>
          </div>
          <div class="fan-glow"></div>`;
        
        card.addEventListener('click', () => handleCardClick(i));
        overlay.appendChild(card);
      }
      updateCardLayout();
    }

    // ===== 更新卡牌布局 =====
    function updateCardLayout() {
      const overlay = document.getElementById('fan-overlay');
      if(!overlay || !overlay.classList.contains('active')) return;

      const cards = overlay.querySelectorAll('.fan-card');
      const centerX = window.innerWidth / 2;
      // 将牌组放在屏幕底部
      const bottomY = window.innerHeight - 160;
      
      // 收集未抽取的卡牌
      const remainingCards = [];
      cards.forEach((card) => {
        const cardIdx = parseInt(card.dataset.cardIdx);
        const isDrawn = drawn.some(d => d.id === cardIdx);
        if (!isDrawn) {
          remainingCards.push(card);
        }
      });
      
      const remaining = remainingCards.length;
      const maxWidth = window.innerWidth - 100;
      const spacing = Math.min(75, maxWidth / Math.max(remaining, 1));
      const totalWidth = (remaining - 1) * spacing;
      const startX = centerX - totalWidth / 2;
      
      // 隐藏已抽取的卡牌
      cards.forEach((card) => {
        const cardIdx = parseInt(card.dataset.cardIdx);
        const isDrawn = drawn.some(d => d.id === cardIdx);
        if (isDrawn) {
          card.style.display = 'none';
          card.style.pointerEvents = 'none';
        }
      });
      
      // 排列剩余的卡牌
      remainingCards.forEach((card, idx) => {
        card.style.display = 'block';
        card.style.pointerEvents = 'auto';
        
        // 使用相对索引计算位置，确保居中排列
        card.style.left = (startX + idx * spacing) + 'px';
        card.style.top = bottomY + 'px';
        card.style.transform = `rotate(${Math.sin(idx * 0.3) * 8}deg)`;
        card.style.zIndex = 60;
      });
    }

    // ===== 处理卡牌点击（点击模式） =====
    function handleCardClick(cardIdx) {
      if(currentMode !== 'click') return;
      if(drawn.length >= spread.count) return;
      
      // 检查是否已选过
      if(drawn.some(d => d.id === cardIdx)) return;
      
      // 获取卡牌元素
      const cardEl = document.querySelector(`#fan-overlay .fan-card[data-card-idx="${cardIdx}"]`);
      if(!cardEl) return;
      
      // 添加选中动画
      cardEl.classList.add('selected-card');
      
      // 延迟后执行抽取
      setTimeout(() => {
        performDraw(cardIdx, cardEl);
      }, 300);
    }

    // ===== 执行抽牌 =====
    function performDraw(cardIdx, cardEl) {
      const targetSlotIdx = drawn.length;
      if(targetSlotIdx >= spread.count) return;
      
      const targetSlot = document.querySelector(`.slot-card[data-idx="${targetSlotIdx}"]`);
      if(!targetSlot) return;
      
      // 随机正逆位
      const rev = Math.random() > 0.5;
      const c = CARDS[cardIdx];
      const d = {
        id: cardIdx, name: c.name, sym: c.sym, reversed: rev,
        meaning: rev ? c.rev : c.up, pos: spread.pos[targetSlotIdx]
      };
      drawn.push(d);
      
      // 填充牌面
      const front = targetSlot.querySelector('.s-front');
      front.querySelector('.sf-sym').textContent = c.sym;
      front.querySelector('.sf-name').textContent = c.name + (rev ? '\n逆位' : '');
      const oriEl = front.querySelector('.sf-ori');
      oriEl.textContent = rev ? '↩逆位' : '↗正位';
      oriEl.className = 'sf-ori ' + (rev ? 'rev' : 'up');
      
      // 翻牌动画
      targetSlot.classList.add('flipping');
      setTimeout(() => {
        targetSlot.classList.remove('flipping');
        targetSlot.classList.add('drawn-slot');
        
        // 更新进度
        const nextSlot = document.querySelector(`.slot-card[data-idx="${drawn.length}"]`);
        if(nextSlot && !nextSlot.classList.contains('drawn-slot')) {
          nextSlot.classList.add('current');
        }
        updateProg();
        
        // 更新布局，移除已选卡牌
        updateCardLayout();
        
        // 粒子效果
        const slotRect = targetSlot.getBoundingClientRect();
        spawnDrawParticles(slotRect.left + slotRect.width/2, slotRect.top + slotRect.height/2);
        
        if(drawn.length === spread.count) {
          setTimeout(showResult, 900);
        }
      }, 500);
    }

    // ===== 结果页 =====
    function showResult() {
      document.getElementById('draw-page').classList.remove('active');
      ['camera-box','gesture-tip','hand-cursor','fan-overlay'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      
      // 清空手势粒子和轨迹
      PS.particles = [];
      PS.handTrail = [];
      PS.lastHandX = null;
      PS.lastHandY = null;
      PS.hoveredCardIdx = -1;
      
      // 清空手势canvas
      if(gestureCtx && gestureCanvas) {
        gestureCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);
      }
      
      document.getElementById('result-page').classList.add('active');
      document.getElementById('res-spread-name').textContent = `✦ ${spread.name} ✦`;

      document.getElementById('res-cards').innerHTML = drawn.map(c => `
        <div class="rcard">
          <div class="rcard-icon">${CARDS[c.id].emoji || c.sym}</div>
          <div class="rcard-name">${c.name}</div>
          <div class="rcard-pos">${c.pos}</div>
          <div class="rcard-ori ${c.reversed?'rev':'up'}">${c.reversed?'↩逆位':'↗正位'}</div>
        </div>`).join('');

      genReading();
    }

    // ===== 详细解读生成 =====
    function genReading() {
      const body = document.getElementById('reading-body');
      let html = '';

      // 每张牌的详细解读块
      drawn.forEach((d, i) => {
        const card = CARDS[d.id];
        const isRev = d.reversed;
        const blockClass = isRev ? 'rev-card' : 'up-card';
        const detailText = isRev ? card.revDetail : card.upDetail;
        const oriText = isRev ? '↩ 逆位' : '↗ 正位';
        const kwTags = card.keywords.map(k => `<span class="kw-tag">${k}</span>`).join('');

        // 牌位与牌名的联动说明
        const posContext = getPosContext(spread.id, i, d.pos, card.name, isRev);

        html += `
        <div class="card-reading-block ${blockClass}">
          <div class="crb-header">
            <div class="crb-num">${i + 1}</div>
            <div class="crb-title-wrap">
              <div class="crb-pos-tag">✦ 第 ${i+1} 张 · ${d.pos}</div>
              <div class="crb-card-name">
                ${card.emoji || card.sym} ${card.name}
                <span class="crb-ori-badge">${oriText}</span>
              </div>
            </div>
          </div>
          <div class="crb-keywords">${kwTags}</div>
          <div class="crb-detail-label">🔮 牌义解读</div>
          <div class="crb-detail">${detailText}</div>`;

        if(posContext) {
          html += `<div class="crb-detail-label" style="margin-top:8px">🌸 在「${d.pos}」位置的含义</div>
          <div class="crb-detail">${posContext}</div>`;
        }

        html += `
          <div class="crb-advice-label">💫 行动建议</div>
          <div class="crb-advice">${card.advice}</div>
        </div>`;
      });

      // 整体能量总结
      const upCards = drawn.filter(c => !c.reversed);
      const revCards = drawn.filter(c => c.reversed);
      const upCount = upCards.length, revCount = revCards.length;

      // 牌阵整体叙事
      const narrative = getOverallNarrative();

      html += `
      <div class="reading-overall">
        <h4>✦ 整体能量解读 ✦</h4>
        <div class="energy-row">
          <div class="energy-pill up-pill">
            <div class="ep-num">${upCount}</div>
            <div class="ep-label">正位 · 顺流能量</div>
          </div>
          <div class="energy-pill rev-pill">
            <div class="ep-num">${revCount}</div>
            <div class="ep-label">逆位 · 内化能量</div>
          </div>
          <div class="energy-pill" style="background:rgba(255,228,236,0.5)">
            <div class="ep-num" style="color:var(--rose);font-size:18px">${drawn.length}</div>
            <div class="ep-label">牌阵总张数</div>
          </div>
        </div>
        <div class="overall-text">`;

      // 正逆位比例分析
      if(revCount === 0) {
        html += `<p>✨ <span class="hl">全部正位</span>——此次牌阵所有牌均呈正位，整体能量流动顺畅明朗。外在环境和内在状态趋于协调，是采取积极行动、把握机遇的有利时机。宇宙在这段时间支持你向前走。</p>`;
      } else if(upCount === 0) {
        html += `<p>🌑 <span class="hl">全部逆位</span>——此次牌阵呈现了强烈的向内能量。这并非不吉之兆，而是提示你现在最重要的工作在内心——反思、沉淀与整合。外在行动可以暂缓，先照顾好你的内在世界。</p>`;
      } else {
        const ratio = upCount > revCount ? '正位居多' : (revCount > upCount ? '逆位居多' : '正逆各半');
        const ratioDesc = upCount > revCount
          ? `整体能量偏向外在流动与行动，但有${revCount}张逆位牌提醒你注意内在尚待处理的课题。`
          : (revCount > upCount
            ? `整体能量偏向内在消化与转化，外部行动可能需要更多准备，但${upCount}张正位牌为你指明了方向。`
            : `正逆位能量完美对称，你正处于内外整合的关键节点，既有向外展开的动力，也有向内沉淀的必要。`);

      if(keyCard) {
        html += `<p style="margin-top:10px">🌟 <span class="hl">核心牌</span>——「${keyCard.name}」是此次牌阵的核心能量所在，${keyCard.coreMsg}</p>`;
      }

      html += `</div>
        <div class="overall-guide">
          ${narrative}
        </div>
      </div>`;

      body.innerHTML = html;
    }

    // ===== 牌位联动说明 =====
    function getPosContext(spreadId, idx, posName, cardName, isRev) {
      const contexts = {
        'time': [
          isRev => `在「过去」的位置，${cardName}${isRev?'逆位':'正位'}揭示了曾经影响你的经历与积累的能量。这段过去既已成形，它的意义在于为你提供了成长的底色——${isRev?'也许是一段尚未完全消化的经历，仍在无形中影响你的选择':'正是这段经历赋予了你今天的力量与智慧'}。`,
          isRev => `在「现在」的位置，${cardName}${isRev?'逆位':'正位'}描绘了你当下所处的能量状态与正在经历的核心主题。${isRev?'此刻你内在正经历一些阻力或转化，或许有些事情还未完全明朗':'这张牌所代表的能量是你当下真实拥有的资源，好好运用它'}。`,
          isRev => `在「未来」的位置，${cardName}${isRev?'逆位':'正位'}显示了当你沿着当前轨迹继续前行时可能遇到的情境。${isRev?'这是一个预警信号——如果有些事情不做调整，未来可能面临的挑战':'这是宇宙给你的鼓励，前方的能量是支持你的'}。记住，未来并非固定，你的选择每天都在重塑它。`
        ],
        'cross': [
          isRev => `作为「中心」牌，${cardName}代表了你此刻最核心的能量状态与处境。这是整个牌阵的心脏，所有其他牌的解读都与它相互呼应。`,
          isRev => `在「上方」的位置，代表更高层面的目标、理想或外部影响。${cardName}在此位置揭示了你意识层面的渴望或外界环境的主导能量。`,
          isRev => `在「右方」的位置，代表近期未来或即将进入你生命的能量。${cardName}提示你接下来可能遇到的情境。`,
          isRev => `在「下方」的位置，代表深层基础或潜意识的驱动力。${cardName}揭示了影响你当下处境的根基能量。`,
          isRev => `在「左方」的位置，代表过去的影响或已经走过的经历。${cardName}提示了哪些过去的能量仍在影响着你。`
        ]
      };

      if(contexts[spreadId] && contexts[spreadId][idx]) {
        return contexts[spreadId][idx](isRev);
      }

      // 通用牌位说明
      return `在「${posName}」这个位置，${cardName}${isRev?'逆位':'正位'}的能量提示你${isRev?'在此领域有一些内在阻力或需要调整的模式，留意自己的内在感受':'在此领域具备良好的能量基础，可以信任自己的感知与行动'}。`;
    }

    // ===== 获取关键牌 =====
    function getKeyCard() {
      if(drawn.length === 0) return null;
      // 选大阿卡那中编号最大的，或第一张正位牌，作为"核心牌"
      const majorCards = drawn.filter(d => true); // 全是大阿卡那
      const sorted = [...majorCards].sort((a,b) => b.id - a.id);
      const key = sorted[0];
      const card = CARDS[key.id];
      const msgs = [
        '它是这段旅程中能量最为浓缩的象征，值得你给予最多的关注与反思。',
        '它的能量贯穿整个牌阵，指向了当下最需要被看见与整合的主题。',
        '这张牌代表了此次占卜的最深层讯息，建议你在睡前冥想它的意象。',
        '它携带的信息超越了所在的牌位，是整个占卜的点睛之笔。'
      ];
      return { name: card.name, coreMsg: msgs[key.id % msgs.length] };
    }

    // ===== 整体叙事 =====
    function getOverallNarrative() {
      const cardNames = drawn.map(d => `「${d.name}」`).join('、');
      const hasHope = drawn.some(d => d.id === 17); // 星星
      const hasTower = drawn.some(d => d.id === 16); // 塔
      const hasSun = drawn.some(d => d.id === 19); // 太阳
      const hasWorld = drawn.some(d => d.id === 21); // 世界
      const hasMoon = drawn.some(d => d.id === 18); // 月亮
      const revCount = drawn.filter(d => d.reversed).length;

      let guide = `<strong>💌 给你的话</strong><br>`;

      if(hasWorld) {
        guide += `世界牌的出现是一个深刻的祝福——某个重要的章节正在走向完美的完成。你所经历的一切都是有意义的，此刻值得停下来，深深感谢这段旅程。`;
      } else if(hasSun && hasHope) {
        guide += `太阳与星星同时出现，是塔罗中最温暖的组合之一——光明是真实的，希望是可以触碰的。无论前路如何，你内在的那束光不会熄灭。`;
      } else if(hasTower) {
        guide += `塔牌的出现提示着一次不可避免的转化。请记住：真正属于你的不会在这场震荡中消失，倒塌的只是那些本就不稳固的结构。穿越它，你会发现更真实的自己。`;
      } else if(hasMoon && revCount > 1) {
        guide += `月亮与多张逆位牌的组合提示你此刻处于一段内化与沉淀的阶段。不必强行寻找答案，有些事情需要在安静中自然浮现。给自己多一点耐心与温柔。`;
      } else if(revCount === drawn.length && drawn.length > 1) {
        guide += `全逆位的牌阵是一个强烈的信号——宇宙在邀请你向内转。此刻不是向外求的时候，而是放下期待、与自己真正独处的时刻。在这段沉默中，你会找到下一步的清晰。`;
      } else {
        guide += `此次出现的${cardNames}共同构成了一幅属于你的能量地图。塔罗所呈现的是当下能量的趋势与可能性，而非固定的命运。你永远拥有自由意志去选择、去改变、去创造。`;
      }

      guide += `<br><br>🌸 <em>最后提醒自己：塔罗是一面镜子，映照的是你内心已经知道的真相。信任你的直觉，它比任何牌都更了解你的路。</em>`;
      return guide;
    }

    // ===== 初始化 =====
    window.onload = function() { initBg(); };
  </script>
</body>
